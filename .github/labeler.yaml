version: 1
labels:
  # --- by PR "Type of change" checklist ---
  - label: "feature"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Feature\b'
  - label: "bug"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Bug fix\b'
  - label: "enhancement"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Enhancement\b'
  - label: "refactor"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Refactor\b'
  - label: "breaking-change"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Breaking change\b'
  - label: "security"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Security\b'

  # --- by changed paths ---
  - label: "docs"
    files:
      - "^README\\.md$"
      - "^docs/"
  - label: "ci-cd"
    files:
      - "^\\.github/"
  - label: "tests"
    files:
      - "^test/"
  - label: "dependencies"
    files:
      - "^pnpm-lock\\.yaml$"
  - label: "registry"
    files:
      - "^src/registry/"
  - label: "auth"
    files:
      - "^src/auth\\.ts$"
      - "^src/authentication-method\\.ts$"
      - "^src/token\\.ts$"
  - label: "cache"
    files:
      - "^src/edge-cache\\.ts$"
  - label: "push"
    files:
      - "^push/"
