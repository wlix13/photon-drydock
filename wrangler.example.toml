# Copy to wrangler.toml and fill in your values.
# The real wrangler.toml is gitignored so account-specific values stay local.
name = "photon-drydock"

# Custom Cloudflare domain for worker (required for edge caching)
# routes = [
#  { pattern = "your.custom.domain", custom_domain = true }
# ]

workers_dev = true #set to false to disable the default Worker domain (applicable only if custom domain is used instead)
main = "./index.ts"
compatibility_date = "2024-09-09"
compatibility_flags = ["nodejs_compat"]

## Production
[env.production]
name = "photon-drydock"
r2_buckets = [
  { binding = "REGISTRY", bucket_name = "photon-drydock" }
]
# Workers Caching: set CACHE_ENABLED to activate.
# cache = { enabled = ${CACHE_ENABLED} }

# placement = { mode = "${PLACEMENT_MODE}" }

[env.production.vars]
# JWT auth: set JWT_REGISTRY_TOKENS_PUBLIC_KEY (base64 public key) to activate.
# No auth var: use USERNAME/PASSWORD or READONLY_USERNAME/READONLY_PASSWORD as secrets.
# JWT_REGISTRY_TOKENS_PUBLIC_KEY = "${JWT_REGISTRY_TOKENS_PUBLIC_KEY}"
# Edge caching of manifest and blob reads is on by default (requires custom domain above);
# set to "off" to disable.
EDGE_CACHE = "${EDGE_CACHE:-on}"

# Secrets:
# USERNAME/PASSWORD/READONLY_USERNAME/READONLY_PASSWORD if you want username/password based auth


## Dev - For local dev using `npx wrangler dev`
[env.dev]
r2_buckets = [{ binding = "REGISTRY", bucket_name = "r2-image-registry-dev" }]
[env.dev.vars]
# REGISTRIES_JSON = "[{ \"registry\": \"http://localhost:9999\", \"password_env\": \"PASSWORD\", \"username\": \"hello\" }]"
USERNAME = "hello"
PASSWORD = "world"
# READONLY_USERNAME = "readonly"
# READONLY_PASSWORD = "readonly"
# The necessary secrets are:
# Setup those secrets on .dev.vars in the root of the project
#
